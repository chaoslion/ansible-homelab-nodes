interval: 1m
rules:
  - alert: CommonProbeFailed
    expr: probe_success == 0
    for: 5m
    labels:
      severity: critical
    annotations:
      description: "unreachable"

  - alert: CommonProbeCertExpiringSoon
    expr: probe_ssl_earliest_cert_expiry_seconds - time() < 86400 * 14
    for: 1h
    labels:
      severity: info
    annotations:
      description: 'cert expires in {{ ($value / 86400) | printf "%.1f" }}d'
