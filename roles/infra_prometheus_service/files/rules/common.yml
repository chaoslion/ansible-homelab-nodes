interval: 1m
rules:
  - alert: CommonInstanceDown
    expr: up == 0
    for: 5m
    labels:
      severity: critical
    annotations:
      description: "Target is unreachable."
      summary: "{{ $labels.instance }}"

  - alert: CommonAlertmanagerNotificationsFailing
    expr: rate(alertmanager_notifications_failed_total[15m]) > 0
    for: 5m
    labels:
      severity: critical
    annotations:
      description: "Alertmanager is failing to deliver notifications through this integration."
      summary: "{{ $labels.integration }}: {{ $value | printf \"%.2f\" }}/s failures"
