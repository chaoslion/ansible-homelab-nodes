interval: 1m
rules:
  - alert: CommonInstanceDown
    expr: up == 0
    for: 5m
    labels:
      severity: critical
    annotations:
      description: "unreachable"

  - alert: CommonAlertmanagerNotificationsFailing
    expr: rate(alertmanager_notifications_failed_total[15m]) > 0
    for: 5m
    labels:
      severity: critical
    annotations:
      description: "{{ $labels.integration }}, {{ $value | printf \"%.2f\" }}/s failures"
