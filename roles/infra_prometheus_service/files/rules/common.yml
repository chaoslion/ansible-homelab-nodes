interval: 1m
rules:
  - alert: CommonInstanceDown
    expr: up == 0
    for: 5m
    labels:
      severity: critical
    annotations: description:"Target {{ $labels.instance }} down."

  - alert: CommonAlertmanagerNotificationsFailing
    expr: rate(alertmanager_notifications_failed_total[15m]) > 0
    for: 5m
    labels:
      severity: critical
    annotations: description:"Alertmanager notifications failing on {{ $labels.instance }}."
